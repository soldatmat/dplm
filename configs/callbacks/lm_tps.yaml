defaults:
  - default.yaml

model_checkpoint:
  _target_: byprot.utils.callbacks.ModelCheckpoint
  monitor: "val/loss" # name of the logged metric which determines when model is improving
  mode: "min" # "max" means higher metric value is better, can be also "min"
  save_top_k: 1 # save k best models (determined by above metric)
  save_last: True # additionaly always save model from last epoch
  verbose: True
  dirpath: ${paths.ckpt_dir}
  filename: "step_{global_step}-loss_{val/loss:.2f}"
  auto_insert_metric_name: False
  every_n_train_steps: 1000
  every_n_epochs: null

checkpoint_every_n_steps:
  _target_: byprot.utils.callbacks.CheckpointEveryNSteps
  save_step_frequency: 10000

early_stopping:
  _target_: pytorch_lightning.callbacks.EarlyStopping
  monitor: "val/loss" # name of the logged metric which determines when model is improving
  mode: "min" # "max" means higher metric value is better, can be also "min"
  patience: ${train.patience} # original 1000 # how many validation epochs of not improving until training stops
  min_delta: 0 # minimum change in the monitored metric needed to qualify as an improvement
  check_on_train_epoch_end: false

validate_with_enzyme_explorer:
  _target_: byprot.utils.callbacks.ValidateWithEnzymeExplorer
  every_n_train_steps: 10000
  # Mode selection: use either template_* params OR explicit params below.
  # template_sequences_file: ${datamodule.data_path} # template mode only
  # sequence_column_name: "Aminoacid_sequence" # template mode only
  num_seqs: [50] # explicit mode only
  seq_lens: [350] # explicit mode only
  enzymeexplorer_checkpoint_dir: ${paths.root_dir}/data-bin/checkpoints/enzymeexplorer
  saveto: ${paths.log_dir}/enzyme_explorer_validation
  max_iter: 500
  generation_batch_size: 256
