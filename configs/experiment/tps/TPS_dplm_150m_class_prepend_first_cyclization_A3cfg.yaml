# @package _global_
#
# A3 Option D: per-class label embedding + classifier-free guidance.
# Non-destructive variant of TPS_dplm_150m_class_prepend_first_cyclization.yaml:
# keeps the class_encoder (per-class Embedding) but UNFROZEN (frozen=false, A1
# showed unfreezing helps) and adds condition-dropout cfg_dropout=0.15 with a
# single LEARNED null embedding. At inference, logit-space CFG is enabled via
# --guidance_w (default 0 = off, unchanged behaviour).

defaults:
  - /datamodule: martsdb_class
  - /callbacks: fixedbb_tps
  - /trainer: ddp_fp16

project: "TPS_DPLM_150m_class_prepend_first_cyclization_A3cfg"
name: "tps_dplm_150m_class_prepend_first_cyclization_A3cfg"

datamodule:
  max_tokens: 8192
  class_column: First_cyclization_product
  n_classes: ${csv_unique_count:${datamodule.data_path},${datamodule.class_column}}

model:
  _target_: dplm_class
  decoder:
    num_diffusion_timesteps: 100
    adapter_dropout: 0.1
    from_huggingface: true
    dplm_name: airkingbd/dplm_150m
    encoder_d_model: ${model.encoder.embedding_dim}
    encoder_conditioning_mode: "prepend"
    lora:
      enable: true
      lora_rank: 1
      lora_alpha: 2
      lora_dropout: 0.1
      lora_target_module: esm.(encoder.layer.[0-9]*.(attention.(self.query|self.key|self.value|output.dense).*|(intermediate|output).dense.*))|lm_head.(dense|decoder)
      modules_to_save: ""
  encoder:
    _target_: class_encoder
    output_logits: ${task.learning.output_encoder_logits}
    embedding_dim: 640
    n_classes: ${datamodule.n_classes}
    weight_path: ${paths.data_dir}/MARTS-DB/2026-04-12/embeddings/dplm_150m_stage3_grid_run_41V_step200000/TPS_first_cyclization_embeddings_bos_class_mean.pt
    frozen: false
    cfg_dropout: 0.15

  init_pred_where: true

task:
  _target_: lm/dplm_class
  alphabet: ${datamodule.alphabet}
  learning:
    noise: random_mask
    watch_t1_t2_loss: false
    cal_constant_loss: false
    weight: linear
    output_encoder_logits: false
  criterion:
    _target_: byprot.modules.cross_entropy.RDMCrossEntropyLoss
    label_smoothing: 0.0
    ignore_index: 1
  optimizer:
    type: adamw
    _partial_: true
    lr: ${train.lr}
    betas:
      - 0.9
      - 0.98
    weight_decay: 0.0001
  lr_scheduler:
    type: noam
    warmup_steps: 4000
    model_size: 128
    lr: ${train.lr}
    warmup_init_lr: 1e-07
  generator:
    max_iter: 10
    strategy: "discrete_diffusion"
    temperature: 1.0
    eval_plddt: False
    sampling_strategy: "argmax"
    use_draft_seq: true

train:
  seed: 42
  lr: 0.001
  monitor: "val/loss"
  mode: "min"
  patience: 1000

trainer:
  min_epochs: 10
  max_epochs: 10000
  gradient_clip_val: 0.0
  num_sanity_val_steps: -1
  reload_dataloaders_every_n_epochs: 1
  use_distributed_sampler: false
  max_steps: 200_000
  accumulate_grad_batches: 1
  check_val_every_n_epoch: 1
  val_check_interval: 1.0
  enable_progress_bar: true
  fast_dev_run: false
