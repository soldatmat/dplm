# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - /datamodule: martsdb_class
  - /callbacks: fixedbb_tps
  - /trainer: ddp_fp16

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

# name of the run determines folder name in logs
project: "TPS_DPLM_150m_class_prepend_first_cyclization"
name: "tps_dplm_150m_class_prepend_first_cyclization"

datamodule:
  max_tokens: 8192 # original 6000
  # max_len: 1022
  class_column: First_cyclization_product
  n_classes: ${csv_unique_count:${datamodule.data_path},${datamodule.class_column}}

model:
  _target_: dplm_class
  decoder:
    num_diffusion_timesteps: 100
    adapter_dropout: 0.1
    from_huggingface: true
    dplm_name: airkingbd/dplm_150m
    # dplm_name: /storage/brno2/home/soldatmat/documents/terpene_synthases/dplm/logs/TPS_dplm_150m_stage3_run_8/checkpoints/best.ckpt
    encoder_d_model: ${model.encoder.embedding_dim}
    encoder_conditioning_mode: "prepend"
    lora:
      enable: true
      lora_rank: 1 # original DPLM used 16
      lora_alpha: 2 # original DPLM used 32
      lora_dropout: 0.1
      lora_target_module: esm.(encoder.layer.[0-9]*.(attention.(self.query|self.key|self.value|output.dense).*|(intermediate|output).dense.*))|lm_head.(dense|decoder)
      modules_to_save: ""
  encoder:
    _target_: class_encoder
    output_logits: ${task.learning.output_encoder_logits}
    embedding_dim: 640 # 512
    n_classes: ${datamodule.n_classes}
    weight_path: ${paths.data_dir}/MARTS-DB/2026-04-12/embeddings/dplm_150m_stage3_grid_run_41V_step200000/TPS_first_cyclization_embeddings_bos_class_mean.pt
    frozen: true

  init_pred_where: true

task:
  _target_: lm/dplm_class
  alphabet: ${datamodule.alphabet}
  learning:
    noise: random_mask # enable cmlm training with uniform random masking
    watch_t1_t2_loss: false
    cal_constant_loss: false
    weight: linear
    output_encoder_logits: false
  criterion:
    _target_: byprot.modules.cross_entropy.RDMCrossEntropyLoss
    label_smoothing: 0.0
    ignore_index: 1
  optimizer: # TODO ? change params for training to resemble cfg of DPLM training
    type: adamw
    _partial_: true
    lr: ${train.lr}
    betas:
      - 0.9
      - 0.98
    weight_decay: 0.0001
  lr_scheduler:
    type: noam # is used
    warmup_steps: 4000 # is used by NoamScheduler
    model_size: 128 # is used by NoamScheduler
    lr: ${train.lr} # is used by NoamScheduler
    warmup_init_lr: 1e-07 # accepted but not used by NoamScheduler
  generator:
    max_iter: 10
    strategy: "discrete_diffusion"
    temperature: 1.0
    eval_plddt: False
    sampling_strategy: "argmax"
    use_draft_seq: true

train:
  seed: 42 # does nothing
  lr: 0.001 # original conditioning value
  # monitor: "val/acc_median" # original conditioning value
  # mode: "max" # original conditioning value
  # lr: 0.0004 # original stage 3 value
  monitor: "val/loss" # original stage 3 value
  mode: "min" # original stage 3 value
  patience: 1000 # original stage 3 value

trainer:
  min_epochs: 10
  max_epochs: 10000
  gradient_clip_val: 0.0
  # val_check_interval: 10
  num_sanity_val_steps: -1
  reload_dataloaders_every_n_epochs: 1
  use_distributed_sampler: false
  max_steps: 200_000
  accumulate_grad_batches: 1
  check_val_every_n_epoch: 1
  val_check_interval: 1.0
  enable_progress_bar: true
  fast_dev_run: false # set to true for debugging
