# @package _global_

# specify here default training configuration
defaults:
  - _self_
  - callbacks: # pytorch-lightning callbacks
      - default

  # - trainer: ddp
  - logger: null # set logger here or use command line (e.g. `python train.py logger=tensorboard`)
  - paths: default
  - hydra: default
  - experiment: lm/dplm_150m # specifies pipeline and model

# default name for the experiment, determines logging folder path
# (you can overwrite this name in experiment configs)
name: ???

train:
  # set False to skip model training
  train: True
  # evaluate on test set, using best model weights achieved during training
  # lightning chooses best weights based on the metric specified in checkpoint callback
  test: True

  debug: false

  force_restart: false # force to train from scratch

  # simply provide checkpoint path to resume training
  # it can be either an absolute path,
  # or an relative path which will then be inferred from
  # 1) current workding directory (cwd), or
  # 2) checkpoint directory (${paths.ckpt_dir})
  ckpt_path: last.ckpt

  # Load only the model state_dict from a checkpoint (no optimizer / LR scheduler
  # / global_step / epoch). Useful for fine-tuning from a prior run with fresh
  # optimization state and possibly different model topology (e.g. different LoRA
  # target modules). Keys are matched after stripping PEFT decorations
  # ('base_model.model.' prefix and '.base_layer.') so source/target may differ
  # in LoRA topology. Ignored if ckpt_path is set (which does a full resume).
  init_weights_from: null

  # How to handle source LoRA deltas (lora_A / lora_B) when loading via
  # init_weights_from:
  #   auto   - fold them into base_layer.weight only when the target has no
  #            matching LoRA slot for that module (different rank, or LoRA
  #            disabled). When the target has the matching slot, A and B load
  #            independently. (default)
  #   always - always fold A and B into base_layer.weight; target's LoRA stays
  #            at fresh init even when its slots match the source.
  #   never  - never fold; A and B load only when the target has matching slots,
  #            otherwise their info is dropped silently.
  # Requires the source ckpt to have hyper_parameters.model.lora.lora_alpha for
  # an exact merge; otherwise scaling=1 is used and a warning is logged.
  init_weights_merge_lora: auto

  # Source-architecture shortcut for init_weights_from: rewrites source state_dict
  # key prefixes so a checkpoint trained for one architecture can seed a different
  # one. Recognized values:
  #   null/none/self - no remap (default; both sides use the same architecture).
  #   dplm           - source is a vanilla DPLM ckpt (`model.net.*`); target is a
  #                    DPLMClass arch (`model.decoder.net.*`). Rewrites the prefix
  #                    so the ESM stack transfers; ClassEncoder, conditional
  #                    adapter layers, and any fresh LoRA slots stay at default
  #                    init. Combine with init_weights_merge_lora as needed.
  init_weights_source_arch: null

  # Power-user escape hatch: explicit dict mapping source-key prefixes to target
  # prefixes (longest-prefix match). Overrides init_weights_source_arch when set.
  # Hydra dict syntax: train.init_weights_key_remap='{model.net.: model.decoder.net.}'
  init_weights_key_remap: null

  seed: 42 # seed for random number generators in pytorch, numpy and python.random

  lr: 1e-3 # learning rate
  monitor: ??? # name of the logged metric which determines when model is improving. Used by scheduler (plateau), checkpointer, and early stopping
  mode: ??? # "max" means higher metric value is better, can be also "min". Used by scheduler (plateau), checkpointer, and early stopping
  patience: 30 # how many validation epochs of not improving until training stops
  val_and_save_every_n_steps: null

print_config: True # pretty print config at the start of the run using Rich library
ignore_warnings: True # disable python warnings if they annoy you
seed: 42 # seed for random number generators in pytorch, numpy and python.random
